<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>CMF Tool</title>
<link rel="stylesheet" href="css/panel.css">
</head>
<body>

<nav class="tabs" role="tablist">
  <button class="tab is-active" data-tab="callout" role="tab">標註</button>
  <button class="tab" data-tab="dim" role="tab">尺寸</button>
  <button class="tab" data-tab="excel" role="tab">Excel</button>
  <button class="tab" data-tab="scale" role="tab">縮放</button>
</nav>

<!-- ==================== 標註 ==================== -->
<section class="page" id="page-callout" role="tabpanel">
  <div class="preview"><svg id="preview" viewBox="0 0 260 84" aria-label="標註樣式預覽"></svg></div>

  <button class="add" id="btnAdd">新增標註</button>
  <div class="addopts">
    <select id="lineMode" aria-label="線條模式" title="直線：點 2 下　折線：點 3 下　自由折線：按「完成這條線」結束">
      <option value="straight">直線</option>
      <option value="elbow">折線</option>
      <option value="free">自由折線</option>
    </select>
    <label class="check" title="完成一條後繼續畫下一條"><input type="checkbox" id="continuous">連續</label>
    <button class="link" id="btnConvert" title="把選取的線段轉成標註（從產品畫向編號位置）">轉換線段</button>
  </div>
  <button class="btn strong hidden" id="btnFinish">完成這條線</button>

  <div class="sect">
    <div class="sect-head">
      <span class="sect-title">編號</span>
      <span class="sect-meta" id="tableInfo"></span>
      <button class="link" id="btnLinkExcel" hidden title="指定 Excel 清單後，可以為每個編號選擇對應的物件">連結清單</button>
      <button class="icon-btn" id="btnRefresh" title="重新整理">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5V5h-2.5"/></svg>
      </button>
    </div>
    <div class="numtable" id="numTable"><div class="empty">還沒有標註</div></div>
    <div class="pair mt">
      <select id="sortMode" aria-label="排序方式" title="重新編號的順序">
        <option value="clockwise">順時針</option>
        <option value="topdown">由上到下</option>
        <option value="leftright">由左到右</option>
        <option value="order">補齊空號</option>
      </select>
      <button class="btn" id="btnRenumber">重新編號</button>
    </div>
  </div>

  <details data-key="style">
    <summary>樣式</summary>
    <div class="grid3">
      <button class="btn" id="btnSync" title="文件中所有標註套用目前的樣式">同步全部</button>
      <button class="btn" id="btnRestyle" title="只改選取的標註">套用選取</button>
      <button class="btn" id="btnRelayout" title="用直接選取工具移動線條錨點後，讓編號重新對齊">重新排版</button>
    </div>
    <label class="check"><input type="checkbox" id="autoSync">修改樣式時自動同步全部</label>

    <div class="sub">文字</div>
    <div class="row">
      <label for="fontSize">字級</label>
      <div class="pair">
        <input type="number" id="fontSize" min="1" step="0.5" value="10" title="字級 (pt)">
        <input type="color" id="textColor" value="#000000" title="文字顏色">
      </div>
    </div>
    <div class="row">
      <label for="fontFamily">字體</label>
      <select id="fontFamily"><option value="">預設字體</option></select>
    </div>
    <div class="row">
      <label for="fontStyle">字重</label>
      <div class="pair">
        <select id="fontStyle" disabled></select>
        <button class="icon-btn" id="btnFonts" title="重新讀取字體清單（安裝新字體後）">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5V5h-2.5"/></svg>
        </button>
      </div>
    </div>
    <input type="hidden" id="fontName">
    <label class="check"><input type="checkbox" id="badge">圓圈底</label>
    <div id="badgeRows">
      <div class="row">
        <label for="badgeColor">圓圈</label>
        <div class="pair">
          <input type="color" id="badgeColor" value="#2b7bd6" title="圓圈顏色">
          <input type="color" id="badgeTextColor" value="#ffffff" title="數字顏色">
        </div>
      </div>
      <div class="row">
        <label for="badgePadding">內距</label>
        <input type="number" id="badgePadding" min="0" step="0.5" value="2" title="內距 (pt)">
      </div>
      <div class="row">
        <label for="badgeStrokeWidth">邊框</label>
        <div class="pair">
          <input type="number" id="badgeStrokeWidth" min="0" step="0.25" value="0" title="邊框粗細 (pt)，0 = 無邊框">
          <input type="color" id="badgeStrokeColor" value="#000000" title="邊框顏色">
        </div>
      </div>
    </div>

    <div class="sub">引線</div>
    <div class="row">
      <label for="lineWidth">線寬</label>
      <div class="pair">
        <input type="number" id="lineWidth" min="0.1" step="0.25" value="0.75" title="線寬 (pt)">
        <input type="color" id="lineColor" value="#2b7bd6" title="線條顏色">
      </div>
    </div>
    <div class="row">
      <label for="endStyle">端點</label>
      <div class="pair">
        <select id="endStyle">
          <option value="dot">圓點</option>
          <option value="arrow">箭頭</option>
          <option value="none">無</option>
          <option value="style">繪圖樣式</option>
        </select>
        <input type="number" id="endSize" min="0.5" step="0.5" value="2.5" title="端點大小 (pt)">
      </div>
    </div>
    <div class="row" id="styleRow">
      <label for="styleName">樣式名稱</label>
      <div class="pair">
        <input type="text" id="styleName" value="CMF_Arrow" title="文件裡繪圖樣式的名稱，可在樣式中設定箭頭">
        <div class="unit-field">
          <input type="number" id="styleScale" min="1" step="10" value="100" title="繪圖樣式的線寬、箭頭放大或縮小多少 (%)；縮放分頁縮放文件時會跟著改">
          <span class="unit">%</span>
        </div>
      </div>
    </div>
    <div class="row">
      <label for="gap">間距</label>
      <input type="number" id="gap" min="0" step="0.5" value="2" title="編號與線頭的距離 (pt)">
    </div>
  </details>

  <details data-key="more">
    <summary>其他</summary>
    <div class="row">
      <label for="startMode">下一個</label>
      <div class="pair">
        <select id="startMode">
          <option value="auto">接續最大號</option>
          <option value="manual">指定</option>
        </select>
        <input type="number" id="startNumber" min="1" value="1" aria-label="下一個編號">
      </div>
    </div>
    <label class="check"><input type="checkbox" id="sameNumber">轉換多條線時用同一個編號</label>
    <div class="row">
      <label for="setNumberValue">選取的</label>
      <div class="pair">
        <input type="number" id="setNumberValue" min="1" value="1" aria-label="編號">
        <button class="btn" id="btnSetNumber" title="把選取的標註設為這個編號">設為此編號</button>
      </div>
    </div>
    <div class="grid2 mt">
      <button class="btn" id="btnSelectAll">選取全部標註</button>
      <button class="btn" id="btnToggle">顯示 / 隱藏圖層</button>
    </div>
  </details>
</section>

<!-- ==================== 尺寸 ==================== -->
<section class="page" id="page-dim" role="tabpanel" hidden>

  <!-- 常用設定（參考 Specees）：比例、單位、加單位、小數；字級、文字顏色、線寬、線條顏色 -->
  <div class="quick" role="group" aria-label="常用設定">
    <div class="quick-row r1">
      <label class="qi" for="dimRatio" title="圖面比例">1:x</label>
      <input type="text" id="dimRatio" value="1:1" spellcheck="false" autocomplete="off" data-ime="off"
             title="圖面比例：圖畫成實物的一半大 = 1:2（或只寫 2），標出來的數字會乘 2">
      <select id="dimUnit" title="單位">
        <option value="mm">mm</option>
        <option value="cm">cm</option>
        <option value="in">in</option>
        <option value="pt">pt</option>
        <option value="px">px</option>
        <option value="doc">文件單位</option>
      </select>
      <input type="checkbox" class="tgl-in" id="dimShowUnit" checked>
      <label class="qtgl" for="dimShowUnit" title="數字後面加單位（眼睛閉起來 = 不加）" aria-label="加單位"><svg class="on" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10z"/><circle cx="10" cy="10" r="2.4"/></svg><svg class="off" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10z"/><circle cx="10" cy="10" r="2.4"/><path d="M3.5 16.5 16.5 3.5"/></svg></label>
      <label class="qi" for="dimDecimals" title="小數位數">.00</label>
      <select id="dimDecimals" title="最多幾位小數，尾數的 0 會去掉">
        <option value="0">1</option>
        <option value="1" selected>0.1</option>
        <option value="2">0.01</option>
        <option value="3">0.001</option>
      </select>
    </div>
    <div class="quick-row r2">
      <label class="qi tt" for="dimFontSize" title="字級 (pt)">T<small>t</small></label>
      <input type="number" id="dimFontSize" min="1" step="0.5" value="8" title="字級 (pt)">
      <input type="color" id="dimTextColor" value="#000000" title="文字顏色">
      <label class="qi" for="dimLineWidth" title="線寬 (pt)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 14.5h14" stroke-width="2.6"/><path d="M3 7.5h14" stroke-width="1"/></svg></label>
      <input type="number" id="dimLineWidth" min="0.1" step="0.25" value="0.5" title="線寬 (pt)">
      <input type="color" id="dimLineColor" value="#000000" title="線條和箭頭的顏色">
    </div>
  </div>

  <div class="sect-head">
    <span class="sect-title">選取</span>
    <span class="sect-meta" id="dimSel"></span>
    <button class="icon-btn" id="btnDimRefresh" title="重新讀取選取的物件">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5V5h-2.5"/></svg>
    </button>
  </div>
  <!-- 參考 Specees：中間按鈕標尺寸，四周的圓點選寬高標在哪一邊；右邊選要標的類型（都可以多選） -->
  <div class="dim-pick">
    <div class="pad" id="dimPad" role="group" aria-label="寬高標在哪一邊（可以多選），中間的按鈕標尺寸">
      <input type="checkbox" class="tgl-in" id="dimPosTop" checked>
      <label class="dot up" for="dimPosTop" title="寬度標在上方" aria-label="上"></label>
      <input type="checkbox" class="tgl-in" id="dimPosLeft">
      <label class="dot left" for="dimPosLeft" title="高度標在左側" aria-label="左"></label>
      <div class="pad-core">
        <button class="go" id="btnDimAdd" title="標尺寸：照選好的類型和位置，標註選取的物件" aria-label="標尺寸"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="11" width="16" height="16" rx="1.5"/><path d="M5 6h16M5 4v4M21 4v4M26 11v16M24 11h4M24 27h4"/></svg></button>
      </div>
      <input type="checkbox" class="tgl-in" id="dimPosRight" checked>
      <label class="dot right" for="dimPosRight" title="高度標在右側" aria-label="右"></label>
      <input type="checkbox" class="tgl-in" id="dimPosBottom">
      <label class="dot down" for="dimPosBottom" title="寬度標在下方" aria-label="下"></label>
    </div>
    <div class="types" role="group" aria-label="要標的尺寸（可以多選）">
      <input type="checkbox" class="tgl-in" id="dimTypeSel" checked>
      <label class="ticon" for="dimTypeSel" title="選取範圍的寬高：好幾個物件時標它們合起來的外框" aria-label="選取範圍寬高"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="2.5" y="8.5" width="15" height="9" rx="1" stroke-dasharray="1.6 1.4"/><rect x="4.5" y="11" width="4.5" height="4.5" rx=".8"/><rect x="11" y="10.5" width="4.5" height="5" rx=".8"/><path d="M2.5 5h15M2.5 3.5v3M17.5 3.5v3"/></svg></label>
      <input type="checkbox" class="tgl-in" id="dimTypeEach">
      <label class="ticon" for="dimTypeEach" title="每個物件各自的寬高" aria-label="各物件寬高"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="2" y="9" width="6.5" height="8" rx="1"/><rect x="11.5" y="11" width="6.5" height="6" rx="1"/><path d="M2 5.5h6.5M2 4v3M8.5 4v3M11.5 7.5H18M11.5 6v3M18 6v3"/></svg></label>
      <input type="checkbox" class="tgl-in" id="dimTypeDia">
      <label class="ticon" for="dimTypeDia" title="圓的直徑；選群組時，每種大小的圓標一個" aria-label="直徑"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M5.4 14.6 14.6 5.4"/></svg></label>
      <input type="checkbox" class="tgl-in" id="dimTypeRad">
      <label class="ticon" for="dimTypeRad" title="圓弧、圓角的半徑；同樣大小的圓角標一個" aria-label="半徑"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M4 17v-7a6 6 0 0 1 6-6h7"/><path d="M10 10 6 6"/><circle cx="10" cy="10" r="1" fill="currentColor" stroke="none"/></svg></label>
    </div>
  </div>

  <div class="row">
    <label for="dimOffset">距離</label>
    <input type="number" id="dimOffset" min="0" step="1" value="12" title="寬度、高度的尺寸線離物件的距離 (pt)">
  </div>
  <label class="check" title="寬高量到線條的外緣（跟「變形」面板勾「使用預視邊界」一樣）；不勾 = 只量形狀，不含線寬"><input type="checkbox" id="dimVisible">寬高含線寬</label>
  <label class="check" title="字級、線寬、箭頭、間距、引線和距離跟著量的物件大小等比調整：下面「樣式」的數值是給「基準」大小的物件用的，物件比較大就放大、比較小就縮小（最多縮到一半）。按「同步全部」、「套用選取」時也照每個尺寸量的物件重算"><input type="checkbox" id="dimAuto">依物件大小自動調整樣式</label>
  <div class="row" id="dimAutoRow">
    <label for="dimAutoBase">基準</label>
    <div class="unit-field">
      <input type="number" id="dimAutoBase" min="1" step="10" value="100" title="「樣式」的字級、線寬等適合多大的物件：物件較長的一邊等於這個大小時，照樣式原樣標">
      <span class="unit">mm</span>
    </div>
  </div>
  <div class="hint" id="dimAutoHint"></div>

  <details data-key="dimrad" open>
    <summary>直徑・半徑</summary>
    <div class="row">
      <label for="dimRadMode">標法</label>
      <select id="dimRadMode" title="直徑、半徑怎麼標。已經標好的尺寸，按「樣式 → 同步全部」或「套用選取」改成新的標法">
        <option value="leader" selected>引線拉到圓外</option>
        <option value="through">穿過圓心拉出去</option>
        <option value="inside">畫在圓裡面</option>
        <option value="auto">自動（放得下就畫在圓裡）</option>
      </select>
    </div>
    <div class="row">
      <label for="dimAngle">角度</label>
      <input type="number" id="dimAngle" step="15" value="45" title="直徑、半徑標在哪個方向 (°)：0 = 右，90 = 上，45 = 右上。圓角也會挑最靠這個方向的角（新增時決定）">
    </div>
    <div class="row">
      <label for="dimLeader">引線</label>
      <div class="pair">
        <input type="number" id="dimLeader" min="0" step="1" value="12" title="引線從圓周往外拉多長 (pt)">
        <select id="dimShelf" aria-label="引線末端" title="引線末端：轉一段水平線，文字站在線上或接在線後面；或不要水平線">
          <option value="over">字在線上</option>
          <option value="end">字在線後</option>
          <option value="none">無橫線</option>
        </select>
      </div>
    </div>
    <label class="check" title="半徑畫在圓裡面或穿過圓心時，在圓心畫一個十字"><input type="checkbox" id="dimCenterMark" checked>半徑的圓心畫十字</label>
  </details>

  <details data-key="dimnum" open>
    <summary>數字</summary>
    <div class="row">
      <label for="dimDiaSym">符號</label>
      <div class="pair">
        <select id="dimDiaSym" title="直徑的符號（字體裡要有這個字）">
          <option value="slash">&#xD8;20</option>
          <option value="phi">&#x3C6;20</option>
          <option value="sign">&#x2300;20</option>
        </select>
        <select id="dimCount" aria-label="數量" title="群組裡有好幾個一樣大的圓（或圓角）時，數字前面加上數量">
          <option value="none">不標數量</option>
          <option value="x">4&#xD7;&#xD8;3</option>
          <option value="dash">4-&#xD8;3</option>
        </select>
      </div>
    </div>
    <div class="row">
      <label for="dimPrefix">前後綴</label>
      <div class="pair">
        <input type="text" id="dimPrefix" placeholder="前綴" spellcheck="false" autocomplete="off" title="加在數字前面的文字，例如「約」">
        <input type="text" id="dimSuffix" placeholder="後綴 &#xB1;0.1" spellcheck="false" autocomplete="off" title="加在數字（和單位）後面的文字，例如公差 ±0.1、(參考)">
      </div>
    </div>
  </details>

  <details data-key="dimstyle">
    <summary>樣式</summary>
    <div class="grid2">
      <button class="btn" id="btnDimSync" title="文件中所有尺寸套用目前的樣式、數字格式和直徑半徑的標法（位置不變）">同步全部</button>
      <button class="btn" id="btnDimRestyle" title="只改選取的尺寸">套用選取</button>
    </div>
    <label class="check" title="選取尺寸之後修改樣式、數字或標法，選取的尺寸馬上跟著改"><input type="checkbox" id="dimAutoApply">修改時自動套用到選取的尺寸</label>

    <div class="sub">文字</div>
    <div class="row">
      <label for="dimFontFamily">字體</label>
      <select id="dimFontFamily"><option value="">預設字體</option></select>
    </div>
    <div class="row">
      <label for="dimFontStyle">字重</label>
      <div class="pair">
        <select id="dimFontStyle" disabled></select>
        <button class="icon-btn" id="btnDimFonts" title="重新讀取字體清單（安裝新字體後）">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5V5h-2.5"/></svg>
        </button>
      </div>
    </div>
    <input type="hidden" id="dimFontName">
    <div class="row">
      <label for="dimTextAlign">方向</label>
      <select id="dimTextAlign" title="高度、斜的直徑和半徑，文字要沿著線轉向，還是保持水平">
        <option value="aligned">沿著尺寸線</option>
        <option value="horizontal">一律水平</option>
      </select>
    </div>
    <div class="row">
      <label for="dimTextPos">擺放</label>
      <select id="dimTextPos" title="寬高和畫在圓裡面的直徑、半徑：文字放在尺寸線旁邊，或放在線的中間、把線斷開（放不下時放在旁邊）">
        <option value="above">線的旁邊</option>
        <option value="middle">線的中間（斷開）</option>
      </select>
    </div>
    <div class="row">
      <label for="dimTextGap">文字離線</label>
      <input type="number" id="dimTextGap" min="0" step="0.5" value="2" title="文字放在線的旁邊時，文字跟尺寸線（引線的橫線）之間空多少 (pt)，從線的邊緣算">
    </div>
    <div class="row">
      <label for="dimBreakGap">斷開留空</label>
      <input type="number" id="dimBreakGap" min="0" step="0.5" value="2" title="文字放在線的中間時，文字兩邊跟斷開的線頭之間空多少 (pt)">
    </div>
    <div class="row">
      <label for="dimTextBg">底色</label>
      <div class="pair">
        <select id="dimTextBg" title="文字後面墊一塊底色，標在產品圖、照片上也看得清楚">
          <option value="none">無</option>
          <option value="box">色塊</option>
        </select>
        <input type="color" id="dimTextBgColor" value="#ffffff" title="底色">
      </div>
    </div>

    <div class="sub">線條</div>
    <div class="row">
      <label for="dimEndStyle">端點</label>
      <div class="pair">
        <select id="dimEndStyle">
          <option value="arrow">箭頭</option>
          <option value="open">開放箭頭</option>
          <option value="tick">斜線</option>
          <option value="dot">圓點</option>
          <option value="none">無</option>
        </select>
        <input type="number" id="dimEndSize" min="0.5" step="0.5" value="4" title="端點大小：箭頭、斜線的長度 (pt)">
      </div>
    </div>
    <div class="row">
      <label for="dimArrowPos">箭頭位置</label>
      <select id="dimArrowPos" title="寬高的箭頭（開放箭頭）放在延伸線內側往外指，或放在外側往內指">
        <option value="auto">自動（放不下時放外側）</option>
        <option value="inside">一律內側</option>
        <option value="outside">一律外側</option>
      </select>
    </div>
    <div class="row">
      <label for="dimExtLine">延伸線</label>
      <select id="dimExtLine" title="寬高的延伸線（從物件拉到尺寸線的線）">
        <option value="same">跟尺寸線一樣粗</option>
        <option value="thin">細一半</option>
        <option value="none">不畫</option>
      </select>
    </div>
    <div class="row">
      <label for="dimExtGap">留空/超出</label>
      <div class="pair">
        <input type="number" id="dimExtGap" min="0" step="0.5" value="2" title="延伸線跟物件之間留的空隙 (pt)">
        <input type="number" id="dimExtOver" min="0" step="0.5" value="2" title="延伸線超出尺寸線的長度 (pt)">
      </div>
    </div>
  </details>

  <details data-key="dimmore">
    <summary>其他</summary>
    <div class="grid2">
      <button class="btn" id="btnDimSelectAll">選取全部尺寸</button>
      <button class="btn" id="btnDimToggle">顯示 / 隱藏圖層</button>
    </div>
  </details>
</section>

<!-- ==================== Excel ==================== -->
<section class="page" id="page-excel" role="tabpanel" hidden>
  <div class="file">
    <div class="file-info">
      <div id="fileName" class="file-name is-empty">尚未選擇檔案</div>
      <div id="fileDir" class="file-dir"></div>
    </div>
    <button class="btn" id="btnPick">選擇…</button>
  </div>
  <select id="fileChoices" class="choices" hidden aria-label="同資料夾的 Excel 檔案"></select>
  <div class="source-row"><span id="fileSource"></span><button class="link" id="btnAuto" hidden>改回自動</button></div>

  <button class="add" id="btnUpdate">從 Excel 更新</button>
  <label class="check" title="Excel 存檔後自動更新文件中的文字和表格"><input type="checkbox" id="chkAuto">存檔時自動更新</label>
  <div id="result" class="result" hidden></div>

  <details open data-key="cmf" id="cmfBox">
    <summary>CMF 清單</summary>
    <div class="row">
      <label for="cmfTable">表格</label>
      <select id="cmfTable" title="這個表格會依標註編號排序，序號欄改成標註編號"></select>
    </div>
    <div id="cmfFields" hidden>
      <div class="row">
        <label for="cmfNum">欄位</label>
        <div class="pair">
          <select id="cmfNum" title="序號欄"></select>
          <select id="cmfName" title="物件名稱欄"></select>
        </div>
      </div>
      <div class="row">
        <label for="cmfRest">未對應</label>
        <div class="pair">
          <select id="cmfRest" title="還沒有對應標註的物件">
            <option value="continue">接續編號</option>
            <option value="blank">序號留空</option>
            <option value="hide">不顯示</option>
          </select>
          <select id="cmfHead" title="表格上方的標題列數">
            <option value="">自動標題</option>
            <option value="0">無標題</option>
            <option value="1">標題 1 列</option>
            <option value="2">標題 2 列</option>
            <option value="3">標題 3 列</option>
            <option value="4">標題 4 列</option>
          </select>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="cmfAuto" checked>編號變更時自動排序</label>
      <label class="check" title="Excel 檔案也一起排序、改寫序號並存檔。Excel 開著且有其他未存檔的修改時，排好後留給你自己存檔"><input type="checkbox" id="cmfWrite" checked>同步修改 Excel 檔</label>
      <div class="row" id="cmfFileRow">
        <label for="cmfFile">修改範圍</label>
        <input id="cmfFile" class="namebox" type="text" spellcheck="false" placeholder="整個表格"
               title="Excel 檔只在這個範圍內排序、改序號，範圍外的儲存格不會動。例如 A3:F12，或 A:F（列跟表格相同）。留空 = 整個表格">
      </div>
      <div class="cmf-foot">
        <span id="cmfInfo"></span>
        <button class="btn" id="btnCmfMatch" title="還沒對應的編號，對應到 Excel 中序號相同的物件">依序號對應</button>
      </div>
    </div>
  </details>

  <details open data-key="import">
    <summary>匯入表格</summary>
    <div class="bind-row">
      <input id="rangeRef" class="namebox" type="text" spellcheck="false" placeholder="A1:D10" aria-label="表格範圍"
             title="留空 = 使用 Excel 中選取的範圍；也可以寫 工作表1!A1:D10">
      <button class="btn" id="btnImport">匯入</button>
    </div>
    <label class="check"><input id="chkGrid" type="checkbox">淺灰格線</label>
  </details>

  <details open data-key="bind">
    <summary>綁定文字</summary>
    <div id="selInfo" class="muted">請在 Illustrator 中選取文字物件</div>
    <div class="bind-row mt">
      <input id="cellRef" class="namebox" type="text" spellcheck="false" placeholder="B3" aria-label="儲存格位址"
             title="B3，或指定工作表：工作表1!B3">
      <button class="btn" id="btnBind">綁定</button>
      <button class="btn quiet" id="btnUnbind">解除</button>
    </div>
  </details>

  <details open data-key="refs">
    <summary>文件中的綁定 <span id="refCount" class="count"></span></summary>
    <div id="refList" class="ref-list"><span class="muted">沒有綁定</span></div>
  </details>
</section>

<!-- ==================== 縮放 ==================== -->
<section class="page" id="page-scale" role="tabpanel" hidden>
  <div class="sect-head">
    <span class="sect-title">依物件尺寸縮放</span>
    <span class="sect-meta" id="scaleSel"></span>
    <button class="icon-btn" id="btnScaleRefresh" title="重新讀取選取的物件">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5V5h-2.5"/></svg>
    </button>
  </div>
  <div class="size-grid">
    <span></span><span class="head">目前</span><span class="head">目標</span>
    <label for="scaleW">寬度</label>
    <span class="now" id="scaleNowW">—</span>
    <div class="unit-field">
      <input type="text" id="scaleW" inputmode="decimal" spellcheck="false" autocomplete="off"
             title="選取物件的目標寬度。可以加單位：150mm、15cm、6in；沒寫單位 = 文件的單位">
      <span class="unit" data-len></span>
    </div>
    <label for="scaleH">高度</label>
    <span class="now" id="scaleNowH">—</span>
    <div class="unit-field">
      <input type="text" id="scaleH" inputmode="decimal" spellcheck="false" autocomplete="off"
             title="選取物件的目標高度。可以加單位：150mm、15cm、6in；沒寫單位 = 文件的單位">
      <span class="unit" data-len></span>
    </div>
    <label for="scalePct">比例</label>
    <span class="now">100%</span>
    <div class="unit-field">
      <input type="text" id="scalePct" inputmode="decimal" spellcheck="false" autocomplete="off" title="縮放比例">
      <span class="unit">%</span>
    </div>
  </div>

  <div class="sub">範圍</div>
  <div class="scope">
    <label class="check" title="只縮放這個工作區和上面的物件，工作區左上角不動">
      <input type="radio" name="scaleScope" value="artboard" checked><span id="scaleAbLabel">物件所在的工作區</span>
    </label>
    <label class="check" title="所有工作區和整份文件的物件一起縮放">
      <input type="radio" name="scaleScope" value="all"><span id="scaleAllLabel">全部工作區</span>
    </label>
  </div>
  <label class="check" title="縮放後，標註和尺寸分頁的樣式設定（字級、線寬、端點、間距、引線、距離⋯）乘上同一個比例，之後新增的標註、尺寸跟縮放後的一樣大，不用重新設定"><input type="checkbox" id="scaleStyles" checked>標註、尺寸的樣式設定也跟著縮放</label>

  <button class="add mt" id="btnScale" disabled>縮放</button>
  <p class="hint">物件、文字、線寬、效果和工作區一起等比縮放，看起來跟原本一樣，只有尺寸改變。</p>

  <details open data-key="swap">
    <summary>交換位置和大小</summary>
    <button class="btn block" id="btnSwap" title="選取兩個物件（圖片、群組都可以），兩個互換位置和大小">交換選取的兩個物件</button>
    <label class="check" title="比例不同時，放進對方的範圍裡、置中，不會變形。取消勾選 = 寬高完全換成對方的">
      <input type="checkbox" id="swapRatio" checked>保持比例（放進對方的範圍、置中）
    </label>
  </details>
</section>

<div class="status" id="status">就緒</div>

<script src="js/CSInterface.js"></script>
<script src="js/app.js"></script>
<script src="js/numfield.js"></script>
<script src="js/excel.js"></script>
<script src="js/callout.js"></script>
<script src="js/dimension.js"></script>
<script src="js/scale.js"></script>
</body>
</html>
