<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>CMF Tool</title>
<link rel="stylesheet" href="css/panel.css">
</head>
<body>

<nav class="tabs">
  <!-- 分頁：只有圖示（名稱在滑鼠停上去的說明裡） -->
  <div class="tab-track" role="tablist">
    <button class="tab is-active" data-tab="callout" role="tab" title="標註" aria-label="標註"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="14" cy="6" r="3.6"/><path d="M13.6 4.6l.8-.5v3.8M10.4 6H8L4.6 14.4"/><circle cx="4.4" cy="15" r="1.4" fill="currentColor" stroke="none"/></svg></button>
    <button class="tab" data-tab="dim" role="tab" title="尺寸" aria-label="尺寸"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5v10M17 5v10M3.8 10h12.4M6 7.8 3.8 10 6 12.2M14 7.8l2.2 2.2-2.2 2.2"/></svg></button>
    <button class="tab" data-tab="excel" role="tab" title="Excel" aria-label="Excel"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2.5"/><path d="M3 8.5h14M3 12.3h14M8 8.5V16"/></svg></button>
    <button class="tab" data-tab="scale" role="tab" title="縮放" aria-label="縮放"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="10.5" width="6.5" height="6.5" rx="1.5"/><path d="M9 11 16.5 3.5M12 3.5h4.5V8"/></svg></button>
  </div>
  <button class="icon-btn reload" id="btnReload" title="重新載入外掛：換了新版的 CMFTool 資料夾之後按這裡，不用重開 Illustrator（設定都會保留）" aria-label="重新載入外掛">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.6 7A5.5 5.5 0 0 1 12.4 4.4M13.4 1.9v3h-3M13.4 9a5.5 5.5 0 0 1-9.8 2.6M2.6 14.1v-3h3"/></svg>
  </button>
</nav>

<!-- ==================== 標註 ==================== -->
<section class="page" id="page-callout" role="tabpanel">
  <button class="add" id="btnAdd">新增標註</button>
  <div class="addopts">
    <select id="lineMode" aria-label="線條模式" title="直線：點 2 下　折線：點 3 下　自由折線：按「完成這條線」結束">
      <option value="straight">直線</option>
      <option value="elbow">折線</option>
      <option value="free">自由折線</option>
    </select>
    <label class="check" title="完成一條後繼續畫下一條"><input type="checkbox" id="continuous">連續</label>
    <button class="link" id="btnConvert" title="把選取的線段轉成標註（從產品畫向編號位置）">轉換線段</button>
  </div>
  <button class="btn strong hidden" id="btnFinish">完成這條線</button>

  <div class="sect">
    <div class="sect-head">
      <span class="sect-title">編號</span>
      <span class="sect-meta" id="tableInfo"></span>
      <button class="link" id="btnLinkExcel" hidden title="指定 Excel 清單後，可以為每個編號選擇對應的物件">連結清單</button>
      <button class="icon-btn" id="btnRefresh" title="重新整理">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5V5h-2.5"/></svg>
      </button>
    </div>
    <div class="numtable" id="numTable"><div class="empty">還沒有標註</div></div>
    <div class="pair mt">
      <select id="sortMode" aria-label="排序方式" title="重新編號的順序">
        <option value="clockwise">順時針</option>
        <option value="topdown">由上到下</option>
        <option value="leftright">由左到右</option>
        <option value="order">補齊空號</option>
      </select>
      <button class="btn" id="btnRenumber">重新編號</button>
    </div>
  </div>

  <details data-key="style">
    <summary>樣式</summary>
    <!-- 一個標註的圖：點編號、圓圈、引線、端點，打開那個部位的設定卡片，
         卡片放在圖的下面（js/callout.js 畫圖，js/figcard.js 開關卡片）。右上角「重設」大小 -->
    <div class="fig-wrap">
      <div class="cfig">
        <svg id="preview" viewBox="0 0 240 240" role="group" aria-label="標註的樣式：點圖上的編號、圓圈、引線或端點，打開它的設定"></svg>
        <button class="fig-reset" id="btnReset" type="button" title="重設大小：字級、圓圈內距和邊框、線寬、端點大小、繪圖樣式的 %、間距改回預設值（顏色、字體、圓圈底開關、端點樣式不變）" aria-label="重設大小"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3.2 8.6A4.9 4.9 0 1 0 4.6 4.4"/><path d="M4.4 1.9v2.7h2.7"/></svg></button>
      </div>
      <div class="pop" id="stylePop" role="dialog" aria-labelledby="popTitle" hidden>
        <div class="pop-head"><span class="pop-title" id="popTitle">文字</span><button class="icon-btn pop-close" title="關閉（Esc）" aria-label="關閉"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>

        <div class="pane" data-pane="text">
          <div class="row">
            <label for="fontSize">字級</label>
            <div class="pair">
              <input type="number" id="fontSize" min="1" step="0.5" value="10" title="字級 (pt)">
              <input type="color" id="textColor" value="#000000" title="編號的顏色">
              <input type="color" id="badgeTextColor" value="#ffffff" title="圓圈裡的數字顏色">
            </div>
          </div>
          <div class="row">
            <label for="fontFamily">字體</label>
            <select id="fontFamily"><option value="">預設字體</option></select>
          </div>
          <div class="row">
            <label for="fontStyle">字重</label>
            <div class="pair">
              <select id="fontStyle" disabled></select>
              <button class="icon-btn" id="btnFonts" title="重新讀取字體清單（安裝新字體後）">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5V5h-2.5"/></svg>
              </button>
            </div>
          </div>
          <input type="hidden" id="fontName">
        </div>

        <div class="pane" data-pane="badge" hidden>
          <label class="check"><input type="checkbox" id="badge">圓圈底</label>
          <div id="badgeRows">
            <div class="row">
              <label for="badgeColor">顏色</label>
              <input type="color" id="badgeColor" value="#2b7bd6" title="圓圈顏色">
            </div>
            <div class="row">
              <label for="badgePadding">內距</label>
              <input type="number" id="badgePadding" min="0" step="0.5" value="2" title="數字到圓圈邊緣的距離 (pt)">
            </div>
            <div class="row">
              <label for="badgeStrokeWidth">邊框</label>
              <div class="pair">
                <input type="number" id="badgeStrokeWidth" min="0" step="0.25" value="0" title="邊框粗細 (pt)，0 = 無邊框">
                <input type="color" id="badgeStrokeColor" value="#000000" title="邊框顏色">
              </div>
            </div>
          </div>
        </div>

        <div class="pane" data-pane="line" hidden>
          <div class="row">
            <label for="lineWidth">線寬</label>
            <div class="pair">
              <input type="number" id="lineWidth" min="0.1" step="0.25" value="0.75" title="線寬 (pt)">
              <input type="color" id="lineColor" value="#2b7bd6" title="線條顏色">
            </div>
          </div>
          <div class="row">
            <label for="gap">間距</label>
            <input type="number" id="gap" min="0" step="0.5" value="2" title="編號（或圓圈）跟線頭的距離 (pt)">
          </div>
        </div>

        <div class="pane" data-pane="end" hidden>
          <div class="row">
            <label for="endStyle">端點</label>
            <div class="pair">
              <select id="endStyle">
                <option value="dot">圓點</option>
                <option value="arrow">箭頭</option>
                <option value="none">無</option>
                <option value="style">繪圖樣式</option>
              </select>
              <input type="number" id="endSize" min="0.5" step="0.5" value="2.5" title="端點大小 (pt)">
            </div>
          </div>
          <div class="row" id="styleRow">
            <label for="styleName">樣式名稱</label>
            <div class="pair">
              <input type="text" id="styleName" value="CMF_Arrow" title="文件裡繪圖樣式的名稱，可在樣式中設定箭頭">
              <div class="unit-field">
                <input type="number" id="styleScale" min="1" step="10" value="100" title="繪圖樣式的線寬、箭頭放大或縮小多少 (%)；縮放分頁縮放文件時會跟著改">
                <span class="unit">%</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- 工具列（滑鼠停上去有說明）：同步全部、套用選取、吸取樣式、重新排版、修改樣式時自動同步全部 -->
    <div class="tools" role="toolbar" aria-label="標註的樣式工具">
      <button class="ibtn" id="btnSync" title="同步全部：工作區裡的標註都套用目前的樣式；工作區外面的不動（要改就選取後按「套用選取」）" aria-label="同步全部"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5a6 6 0 0 1 10.4-3.8M16 10.5a6 6 0 0 1-10.4 3.8M14.8 3v3h-3M5.2 17v-3h3"/><rect x="8" y="8" width="4" height="4" rx="1"/></svg></button>
      <button class="ibtn" id="btnRestyle" title="套用選取：只把選取的標註改成目前的樣式" aria-label="套用選取"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3.5l9.5 4.8-4.2 1.3-1.6 4.3z"/><path d="M14.5 11.5l.8 1.7 1.7.8-1.7.8-.8 1.7-.8-1.7-1.7-.8 1.7-.8z"/></svg></button>
      <button class="ibtn" id="btnPickStyle" title="吸取樣式：選取一個標註後按這裡：下面的樣式改成跟它一樣，之後新增的標註就用這個樣式（要改其他標註，再按「同步全部」或「套用選取」）" aria-label="吸取樣式"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.6 3.6a1.9 1.9 0 0 1 2.7 0l1.1 1.1a1.9 1.9 0 0 1 0 2.7l-1.6 1.6-3.8-3.8z"/><path d="M11 5.2 4.4 11.8 3.5 16.5l4.7-.9 6.6-6.6"/></svg></button>
      <button class="ibtn" id="btnRelayout" title="重新排版：用直接選取工具移動線條錨點後，讓編號重新對齊" aria-label="重新排版"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="14" cy="6.5" r="3.2"/><path d="M11.2 8.2 4.8 15.5"/><circle cx="4.5" cy="15.8" r="1.3" fill="currentColor" stroke="none"/><path d="M2.5 6.5h6" stroke-dasharray="1.6 1.8"/></svg></button>
      <input type="checkbox" class="tgl-in" id="autoSync"><label class="ibtn tbtn" for="autoSync" title="修改樣式時自動同步全部：改了樣式，工作區裡的標註馬上跟著改" aria-label="修改樣式時自動同步全部"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 2.5 5 11h4.2l-1 6.5 6-8.6H10z"/></svg></label>
    </div>
  </details>

  <details data-key="more">
    <summary>其他</summary>
    <div class="row">
      <label for="startMode">下一個</label>
      <div class="pair">
        <select id="startMode">
          <option value="auto">接續最大號</option>
          <option value="manual">指定</option>
        </select>
        <input type="number" id="startNumber" min="1" value="1" aria-label="下一個編號">
      </div>
    </div>
    <label class="check"><input type="checkbox" id="sameNumber">轉換多條線時用同一個編號</label>
    <div class="row">
      <label for="setNumberValue">選取的</label>
      <div class="pair">
        <input type="number" id="setNumberValue" min="1" value="1" aria-label="編號">
        <button class="btn" id="btnSetNumber" title="把選取的標註設為這個編號">設為此編號</button>
      </div>
    </div>
    <div class="grid2 mt">
      <button class="btn" id="btnSelectAll">選取全部標註</button>
      <button class="btn" id="btnToggle">顯示 / 隱藏圖層</button>
    </div>
  </details>
</section>

<!-- ==================== 尺寸 ==================== -->
<section class="page" id="page-dim" role="tabpanel" hidden>

  <div class="sect-head">
    <span class="sect-title">選取</span>
    <span class="sect-meta" id="dimSel"></span>
    <button class="icon-btn" id="btnDimRefresh" title="重新讀取選取的物件">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5V5h-2.5"/></svg>
    </button>
  </div>
  <!-- 標尺寸：上面一列選要標的類型（可以多選）、按「標尺寸」；寬高標在哪一邊用下面示範框裡矩形四邊的圓點選（可以多選），
       示範框照選好的邊畫。版面參考 Specees -->
  <div class="dim-bar">
    <div class="types" role="group" aria-label="要標的尺寸（可以多選）">
      <input type="checkbox" class="tgl-in" id="dimTypeSel" checked>
      <label class="ticon" for="dimTypeSel" title="選取範圍的寬高：好幾個物件時標它們合起來的外框" aria-label="選取範圍寬高"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="2.5" y="8.5" width="15" height="9" rx="1" stroke-dasharray="1.6 1.4"/><rect x="4.5" y="11" width="4.5" height="4.5" rx=".8"/><rect x="11" y="10.5" width="4.5" height="5" rx=".8"/><path d="M2.5 5h15M2.5 3.5v3M17.5 3.5v3"/></svg></label>
      <input type="checkbox" class="tgl-in" id="dimTypeEach">
      <label class="ticon" for="dimTypeEach" title="每個物件各自的寬高" aria-label="各物件寬高"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="2" y="9" width="6.5" height="8" rx="1"/><rect x="11.5" y="11" width="6.5" height="6" rx="1"/><path d="M2 5.5h6.5M2 4v3M8.5 4v3M11.5 7.5H18M11.5 6v3M18 6v3"/></svg></label>
      <input type="checkbox" class="tgl-in" id="dimTypeDia">
      <label class="ticon" for="dimTypeDia" title="圓的直徑；選群組時，每種大小的圓標一個" aria-label="直徑"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M5.4 14.6 14.6 5.4"/></svg></label>
      <input type="checkbox" class="tgl-in" id="dimTypeRad">
      <label class="ticon" for="dimTypeRad" title="圓弧、圓角的半徑；同樣大小的圓角標一個" aria-label="半徑"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M4 17v-7a6 6 0 0 1 6-6h7"/><path d="M10 10 6 6"/><circle cx="10" cy="10" r="1" fill="currentColor" stroke="none"/></svg></label>
    </div>
    <span class="sp"></span>
    <button class="go alt" id="btnDimLen" type="button" aria-pressed="false" title="兩點距離：切到鋼筆，點起點、點終點，標一個箭頭和中間的距離（不用選物件）。箭頭只畫一端時畫在起點。按住 Shift 鎖水平、垂直；可以一直標下去，再按一次或 Esc 結束" aria-label="兩點距離"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12.5h14M5.6 10.3 3 12.5l2.6 2.2M14.4 10.3l2.6 2.2-2.6 2.2"/><path d="M7.5 7h5" stroke-width="1.3"/></svg></button>
    <button class="go" id="btnDimAdd" title="標尺寸：照選好的類型和位置，標註選取的物件" aria-label="標尺寸"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="11" width="16" height="16" rx="1.5"/><path d="M5 6h16M5 4v4M21 4v4M26 11v16M24 11h4M24 27h4"/></svg></button>
  </div>
  <!-- 示範框：照目前的樣式畫一個尺寸，左上角切換標矩形（寬、高）或標圓（直徑）。點文字、尺寸線、端點、延伸線，
       打開那個部位的設定卡片，跟標註的圖一樣（js/dimension.js 畫圖，js/figcard.js 開關卡片）。
       矩形四邊的圓點（#dimPad）選寬高標在哪一邊，位置由 js/dimension.js 照畫出來的矩形放 -->
  <div class="fig-wrap">
    <div class="cfig">
      <svg id="dimPreview" viewBox="0 0 240 240" role="group" aria-label="尺寸的樣式：點圖上的文字、尺寸線、端點或延伸線，打開它的設定"></svg>
      <div class="fig-mode" role="radiogroup" aria-label="示範標哪一種">
        <input type="radio" class="tgl-in" name="dimFig" id="dimFigRect" value="rect" checked>
        <label class="fm" for="dimFigRect" title="示範標矩形：寬度、高度"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="2.5" y="5.5" width="11" height="8" rx=".8"/><path d="M2.5 2.5h11M2.5 1.5v2M13.5 1.5v2"/></svg></label>
        <input type="radio" class="tgl-in" name="dimFig" id="dimFigCircle" value="circle">
        <label class="fm" for="dimFigCircle" title="示範標圓：直徑"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="6.5" cy="9.5" r="5"/><path d="M10 6 12.5 3.5H15.5"/></svg></label>
        <input type="radio" class="tgl-in" name="dimFig" id="dimFigLen" value="len">
        <label class="fm" for="dimFigLen" title="示範兩點距離：箭頭和中間的距離（上面的「兩點距離」按鈕標）"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 4v9M14.5 4v9M2 8.5h12M4 7l-2 1.5L4 10M12 7l2 1.5-2 1.5"/></svg></label>
      </div>
      <div class="pad" id="dimPad" role="group" aria-label="寬高標在哪一邊（可以多選）">
        <input type="checkbox" class="tgl-in" id="dimPosTop" checked>
        <label class="dot up" for="dimPosTop" title="寬度標在上方" aria-label="上"></label>
        <input type="checkbox" class="tgl-in" id="dimPosLeft">
        <label class="dot left" for="dimPosLeft" title="高度標在左側" aria-label="左"></label>
        <input type="checkbox" class="tgl-in" id="dimPosRight" checked>
        <label class="dot right" for="dimPosRight" title="高度標在右側" aria-label="右"></label>
        <input type="checkbox" class="tgl-in" id="dimPosBottom">
        <label class="dot down" for="dimPosBottom" title="寬度標在下方" aria-label="下"></label>
      </div>
      <button class="fig-reset" id="btnDimReset" type="button" title="重設大小：字級、線寬、端點、文字離線、斷開留空、延伸線、引線、距離和自動調整的基準改回預設值（顏色、字體、數字格式、標法不變）" aria-label="重設大小"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3.2 8.6A4.9 4.9 0 1 0 4.6 4.4"/><path d="M4.4 1.9v2.7h2.7"/></svg></button>
    </div>
    <div class="pop" id="dimPop" role="dialog" aria-labelledby="dimPopTitle" hidden>

              <option value="cm">cm</option>

          </div>
          <div class="row">
            <label for="dimLeader">引線</label>
            <div class="pair">
              <input type="number" id="dimLeader" min="0" step="1" value="12" title="引線從圓周往外拉多長 (pt)">

                <option value="over">字在線上</option>
                <option value="end">字在線後</option>
                <option value="none">無橫線</option>
              </select>
            </div>
          </div>
          <label class="check" title="半徑畫在圓裡面或穿過圓心時，在圓心畫一個十字"><input type="checkbox" id="dimCenterMark" checked>半徑的圓心畫十字</label>
        </div>
      </div>

      <div class="pane" data-pane="end" hidden>
        <div class="row">
          <label for="dimEndStyle">端點</label>
          <div class="pair">
            <select id="dimEndStyle">
              <option value="arrow">箭頭</option>
              <option value="open">開放箭頭</option>
              <option value="tick">斜線</option>
              <option value="dot">圓點</option>
              <option value="none">無</option>
            </select>
            <input type="number" id="dimEndSize" min="0.5" step="0.5" value="4" title="端點大小：箭頭、斜線的長度 (pt)">
          </div>
        </div>
        <div class="row only-len">
          <label for="dimLenEnds">兩點距離</label>
          <select id="dimLenEnds" title="兩點距離的箭頭：兩端都畫，或只畫在起點（第一下點的地方），另一端留給文字說明">
            <option value="both">兩端</option>
            <option value="one">只畫起點（單向）</option>
          </select>
        </div>
        <div class="row only-rect and-len">
          <label for="dimArrowPos">箭頭位置</label>
          <select id="dimArrowPos" title="寬高的箭頭（開放箭頭）放在延伸線內側往外指，或放在外側往內指">
            <option value="auto">自動（放不下時放外側）</option>
            <option value="inside">一律內側</option>
            <option value="outside">一律外側</option>
          </select>
        </div>
      </div>

      <div class="pane" data-pane="ext" hidden>
        <div class="row">
          <label for="dimExtLine">延伸線</label>

            <option value="thin">細一半</option>
            <option value="none">不畫</option>
          </select>
        </div>
        <div class="row">
          <label for="dimExtGap">留空/超出</label>
          <div class="pair">
            <input type="number" id="dimExtGap" min="0" step="0.5" value="2" title="延伸線跟物件之間留的空隙 (pt)">
            <input type="number" id="dimExtOver" min="0" step="0.5" value="2" title="延伸線超出尺寸線的長度 (pt)">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 工具列（滑鼠停上去有說明）：量法的兩個開關 | 樣式：同步全部、套用選取、吸取樣式、修改時自動套用 | ⋯ 其他 -->
  <div class="tools" role="toolbar" aria-label="尺寸的工具">
    <input type="checkbox" class="tgl-in" id="dimVisible"><label class="ibtn tbtn" for="dimVisible" title="含線寬：量到線條的外緣：寬高跟「變形」面板勾「使用預視邊界」一樣，圓的直徑、圓角的半徑也加上線寬；不勾 = 只量形狀（線條中間）" aria-label="含線寬"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="4.5" width="11" height="11" rx="2.5" stroke-width="3"/><rect x="1.8" y="1.8" width="16.4" height="16.4" rx="4" stroke-width=".9" stroke-dasharray="1.5 1.6"/></svg></label>
    <input type="checkbox" class="tgl-in" id="dimAuto"><label class="ibtn tbtn" for="dimAuto" title="依物件大小自動調整樣式：字級、線寬、箭頭、間距、引線和距離跟著量的物件大小等比調整：示範框裡的樣式數值是給「基準」大小的物件用的，物件比較大就放大、比較小就縮小（最多縮到一半）。只在新增尺寸時作用；「同步全部」、「套用選取」會把尺寸都改成面板上的樣式" aria-label="依物件大小自動調整樣式"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="11" width="6" height="6" rx="1.2"/><rect x="2.5" y="2.5" width="15" height="15" rx="3" stroke-dasharray="1.6 1.8"/><path d="M10 10l4.5-4.5M11 5.5h3.5V9"/></svg></label>
    <span class="tools-sep"></span>
    <button class="ibtn" id="btnDimSync" title="同步全部：工作區裡的尺寸都改成面板上的樣式（字級、線寬一樣大）、數字格式和直徑半徑的標法，位置不變；工作區外面的不動（要改就選取後按「套用選取」）" aria-label="同步全部"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5a6 6 0 0 1 10.4-3.8M16 10.5a6 6 0 0 1-10.4 3.8M14.8 3v3h-3M5.2 17v-3h3"/><rect x="8" y="8" width="4" height="4" rx="1"/></svg></button>
    <button class="ibtn" id="btnDimRestyle" title="套用選取：只把選取的尺寸改成面板上的樣式" aria-label="套用選取"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3.5l9.5 4.8-4.2 1.3-1.6 4.3z"/><path d="M14.5 11.5l.8 1.7 1.7.8-1.7.8-.8 1.7-.8-1.7-1.7-.8 1.7-.8z"/></svg></button>
    <button class="ibtn" id="btnDimPickStyle" title="吸取樣式：選取一個尺寸後按這裡：樣式和數字的設定改成跟它一樣，之後新增的尺寸就用這個樣式（要改其他尺寸，再按「同步全部」或「套用選取」）" aria-label="吸取樣式"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.6 3.6a1.9 1.9 0 0 1 2.7 0l1.1 1.1a1.9 1.9 0 0 1 0 2.7l-1.6 1.6-3.8-3.8z"/><path d="M11 5.2 4.4 11.8 3.5 16.5l4.7-.9 6.6-6.6"/></svg></button>
    <input type="checkbox" class="tgl-in" id="dimAutoApply"><label class="ibtn tbtn" for="dimAutoApply" title="修改時自動套用到選取的尺寸：選取尺寸之後修改樣式、數字或標法，選取的尺寸馬上跟著改" aria-label="修改時自動套用到選取的尺寸"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 2.5 5 11h4.2l-1 6.5 6-8.6H10z"/></svg></label>
    <span class="sp"></span>
    <button class="ibtn" id="btnDimMore" title="其他" aria-label="其他" aria-expanded="false" aria-controls="dimMore"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="10" r="1.3" fill="currentColor" stroke="none"/><circle cx="10" cy="10" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="1.3" fill="currentColor" stroke="none"/></svg></button>
  </div>
  <div class="tools tools-more" id="dimMore" hidden>
    <button class="ibtn" id="btnDimSelectAll" title="選取全部尺寸：選取文件裡所有用 CMF Tool 標的尺寸" aria-label="選取全部尺寸"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="15" height="15" rx="3.5" stroke-dasharray="1.8 1.9"/><path d="M6.5 10h7M6.5 8.3v3.4M13.5 8.3v3.4"/></svg></button>
    <button class="ibtn" id="btnDimToggle" title="顯示 / 隱藏尺寸圖層：切換尺寸所在圖層的顯示" aria-label="顯示 / 隱藏尺寸圖層"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10z"/><circle cx="10" cy="10" r="2.3"/></svg></button>
  </div>

<!-- ==================== Excel ==================== -->
<section class="page" id="page-excel" role="tabpanel" hidden>
  <div class="file">
    <div class="file-info">
      <div id="fileName" class="file-name is-empty">尚未選擇檔案</div>
      <div id="fileDir" class="file-dir"></div>

  <button class="add" id="btnUpdate">從 Excel 更新</button>

    <button class="link" id="btnWriteBack" title="現在就把 Illustrator 裡改過的綁定文字寫回 Excel；Excel 那邊也改過、或不知道是哪邊改的，也用 Illustrator 的（公式不會被蓋掉）">現在寫回</button>
  </div>
  <div id="result" class="result" hidden></div>

    <summary>CMF 清單</summary>
    <div class="row">
      <label for="cmfTable">表格</label>
      <select id="cmfTable" title="這個表格會依標註編號排序，序號欄改成標註編號"></select>
    </div>

      <div class="row">
        <label for="cmfNum">欄位</label>

          <select id="cmfNum" title="序號欄"></select>
          <select id="cmfName" title="物件名稱欄"></select>
        </div>
      </div>
      <div class="row">
        <label for="cmfRest">未對應</label>
        <div class="pair">
          <select id="cmfRest" title="還沒有對應標註的物件">
            <option value="continue">接續編號</option>
            <option value="blank">序號留空</option>
            <option value="hide">不顯示</option>
          </select>
          <select id="cmfHead" title="表格上方的標題列數">
            <option value="">自動標題</option>
            <option value="0">無標題</option>
            <option value="1">標題 1 列</option>
            <option value="2">標題 2 列</option>
            <option value="3">標題 3 列</option>
            <option value="4">標題 4 列</option>
          </select>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="cmfAuto" checked>編號變更時自動排序</label>
      <label class="check" title="Excel 檔案也一起排序、改寫序號並存檔。Excel 開著且有其他未存檔的修改時，排好後留給你自己存檔"><input type="checkbox" id="cmfWrite" checked>同步修改 Excel 檔</label>
      <div class="row" id="cmfFileRow">
        <label for="cmfFile">修改範圍</label>
        <input id="cmfFile" class="namebox" type="text" spellcheck="false" placeholder="整個表格"
               title="Excel 檔只在這個範圍內排序、改序號，範圍外的儲存格不會動。例如 A3:F12，或 A:F（列跟表格相同）。留空 = 整個表格">
      </div>

        <span id="cmfInfo"></span>

      </div>

  <details open data-key="import">

      <input id="cellRef" class="namebox" type="text" spellcheck="false" placeholder="B3" aria-label="儲存格位址"
             title="B3，或指定工作表：工作表1!B3">

      <button class="btn quiet" id="btnUnbind">解除</button>
    </div>
  </details>

  <details open data-key="refs">
    <summary>文件中的綁定 <span id="refCount" class="count"></span></summary>
    <div id="refList" class="ref-list"><span class="muted">沒有綁定</span></div>
  </details>
</section>

<!-- ==================== 縮放 ==================== -->
<section class="page" id="page-scale" role="tabpanel" hidden>
  <div class="sect-head">
    <span class="sect-title">依物件尺寸縮放</span>
    <span class="sect-meta" id="scaleSel"></span>
    <button class="icon-btn" id="btnScaleRefresh" title="重新讀取選取的物件">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5V5h-2.5"/></svg>
    </button>
  </div>
  <div class="size-grid">
    <span></span><span class="head">目前</span><span class="head">目標</span>
    <label for="scaleW">寬度</label>
    <span class="now" id="scaleNowW">—</span>
    <div class="unit-field">
      <input type="text" id="scaleW" inputmode="decimal" spellcheck="false" autocomplete="off"
             title="選取物件的目標寬度。可以加單位：150mm、15cm、6in；沒寫單位 = 文件的單位">
      <span class="unit" data-len></span>
    </div>
    <label for="scaleH">高度</label>
    <span class="now" id="scaleNowH">—</span>
    <div class="unit-field">
      <input type="text" id="scaleH" inputmode="decimal" spellcheck="false" autocomplete="off"
             title="選取物件的目標高度。可以加單位：150mm、15cm、6in；沒寫單位 = 文件的單位">
      <span class="unit" data-len></span>
    </div>
    <label for="scalePct">比例</label>
    <span class="now">100%</span>
    <div class="unit-field">
      <input type="text" id="scalePct" inputmode="decimal" spellcheck="false" autocomplete="off" title="縮放比例">
      <span class="unit">%</span>
    </div>
  </div>

  <div class="sub">範圍</div>
  <div class="scope">
    <label class="check" title="只縮放這個工作區和上面的物件，工作區左上角不動">
      <input type="radio" name="scaleScope" value="artboard" checked><span id="scaleAbLabel">物件所在的工作區</span>
    </label>
    <label class="check" title="所有工作區和整份文件的物件一起縮放">
      <input type="radio" name="scaleScope" value="all"><span id="scaleAllLabel">全部工作區</span>
    </label>
  </div>
  <label class="check" title="縮放後，標註和尺寸分頁的樣式設定（字級、線寬、端點、間距、引線、距離⋯）乘上同一個比例，之後新增的標註、尺寸跟縮放後的一樣大，不用重新設定"><input type="checkbox" id="scaleStyles" checked>標註、尺寸的樣式設定也跟著縮放</label>

  <button class="add mt" id="btnScale" disabled>縮放</button>
  <p class="hint">物件、文字、線寬、效果和工作區一起等比縮放，看起來跟原本一樣，只有尺寸改變。</p>

  <details open data-key="swap">
    <summary>交換位置和大小</summary>
    <button class="btn block" id="btnSwap" title="選取兩個物件（圖片、群組都可以），兩個互換位置和大小">交換選取的兩個物件</button>
    <label class="check" title="比例不同時，放進對方的範圍裡、置中，不會變形。取消勾選 = 寬高完全換成對方的">
      <input type="checkbox" id="swapRatio" checked>保持比例（放進對方的範圍、置中）
    </label>
  </details>
</section>

<div class="status" id="status">就緒</div>

<script src="js/CSInterface.js"></script>

<script src="js/numfield.js"></script>
<script src="js/figcard.js"></script>
<script src="js/excel.js"></script>
<script src="js/callout.js"></script>
<script src="js/dimension.js"></script>
<script src="js/scale.js"></script>
</body>
</html>
