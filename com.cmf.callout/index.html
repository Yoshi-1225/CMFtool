<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>CMF Callout</title>
<style>
  :root {
    --bg: #323232;
    --fg: #d8d8d8;
    --muted: #8f8f8f;
    --field: #262626;
    --line: #444444;
    --accent: #2680eb; /* 介面按鈕固定色，不跟引線顏色變動 */
    --product: #5a5a5a;
    --rowhover: rgba(255,255,255,.05);
  }
  :root.light {
    --fg: #2a2a2a;
    --muted: #6e6e6e;
    --field: #fafafa;
    --line: #c8c8c8;
    --product: #b9b9b9;
    --rowhover: rgba(0,0,0,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 11px/1.4 "Adobe Clean", "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    padding: 10px 10px 34px;
    user-select: none;
  }

  /* 預覽：跟著樣式即時變化 */
  .preview {
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 3px;
    height: 84px;
    margin-bottom: 8px;
  }
  .preview svg { width: 100%; height: 100%; display: block; }

  .add {
    width: 100%;
    height: 32px;
    border: 0;
    border-radius: 3px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .add:hover { filter: brightness(1.1); }
  .add.active {
    background: transparent;
    color: var(--accent);
    box-shadow: inset 0 0 0 2px var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { box-shadow: inset 0 0 0 2px transparent; } }
  @media (prefers-reduced-motion: reduce) { .add.active { animation: none; } }

  .addopts { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; margin-top: 6px; }
  .tip { color: var(--muted); margin: 4px 0 0; }
  .convertrow { margin: 4px 0 10px; text-align: right; }
  .link {
    background: none; border: 0; padding: 0;
    color: var(--muted); font: inherit; cursor: pointer; text-decoration: underline;
  }
  .link:hover { color: var(--fg); }

  details { border-top: 1px solid var(--line); padding: 6px 0; }
  summary { cursor: pointer; font-weight: 600; padding: 2px 0 4px; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸"; display: inline-block; width: 12px; color: var(--muted); }
  details[open] summary::before { content: "▾"; }

  .row { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 6px; margin: 4px 0; }
  .row > label:first-child { color: var(--muted); }
  .pair { display: flex; gap: 4px; }
  .pair > * { flex: 1; min-width: 0; }

  input[type=text], input[type=number], select {
    width: 100%; height: 22px; padding: 0 5px;
    background: var(--field); color: var(--fg);
    border: 1px solid var(--line); border-radius: 2px; font: inherit;
  }
  input[type=color] {
    width: 100%; height: 22px; padding: 1px;
    background: var(--field); border: 1px solid var(--line); border-radius: 2px;
  }
  input:disabled { opacity: .45; }
  .colorbox { display: flex; gap: 2px; min-width: 0; }
  .colorbox input[type=color] { flex: 1; min-width: 0; }
  .pick {
    flex: 0 0 22px; height: 22px; padding: 0;
    display: grid; place-items: center;
    background: var(--field); color: var(--muted);
    border: 1px solid var(--line); border-radius: 2px; cursor: pointer;
  }
  .pick:hover { color: var(--fg); border-color: var(--muted); }
  .pick.active { color: #fff; background: var(--accent); border-color: var(--accent); }
  .pick:disabled { opacity: .45; cursor: default; }
  .pick svg { width: 13px; height: 13px; display: block; }
  input:focus, select:focus, button:focus-visible { outline: 1px solid var(--accent); outline-offset: 0; }
  .check { display: flex; align-items: center; gap: 6px; margin: 5px 0; }
  .check input { margin: 0; }
  .hidden { display: none !important; }

  .btn {
    height: 24px; padding: 0 8px;
    background: transparent; color: var(--fg);
    border: 1px solid var(--line); border-radius: 3px;
    font: inherit; cursor: pointer;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.strong { border-color: var(--accent); color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 4px; }
  .setnum { display: grid; grid-template-columns: 1fr 48px; gap: 4px; margin-top: 4px; }

  /* 編號表 */
  .tablebar { display: flex; justify-content: space-between; align-items: center; margin: 8px 0 4px; }
  .tablebar span { color: var(--muted); }
  .numtable { border: 1px solid var(--line); border-radius: 3px; max-height: 210px; overflow-y: auto; }
  .numrow {
    display: grid; grid-template-columns: 52px 1fr auto;
    align-items: center; gap: 8px;
    padding: 3px 6px; cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .numrow:last-child { border-bottom: 0; }
  .numrow:hover { background: var(--rowhover); }
  .numrow input { height: 20px; text-align: center; font-weight: 600; }
  .numrow .count { color: var(--muted); }
  .numrow .go { color: var(--muted); }
  .numrow:hover .go { color: var(--fg); }
  .empty { padding: 10px; color: var(--muted); text-align: center; }

  .status {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 6px 10px;
    background: var(--bg); border-top: 1px solid var(--line);
    color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status.error { color: #e0675a; }
</style>
</head>
<body>

<div class="preview">
  <svg id="preview" viewBox="0 0 260 84" aria-label="標註樣式預覽"></svg>
</div>

<button class="add" id="btnAdd">新增標註</button>
<div class="addopts">
  <select id="lineMode" aria-label="線條模式">
    <option value="straight">直線（點 2 下）</option>
    <option value="elbow">折線（點 3 下）</option>
    <option value="free">自由折線</option>
  </select>
  <label class="check"><input type="checkbox" id="continuous"> 連續新增</label>
</div>
<button class="btn strong hidden" id="btnFinish" style="width:100%;margin-top:6px">完成這條線</button>
<p class="tip" id="modeTip"></p>
<div class="convertrow">
  <button class="link" id="btnConvert" title="已用鋼筆或線段工具畫好的線（從產品畫向編號），選取後一次轉換">轉換選取的線段</button>
</div>

<details open>
  <summary>編號</summary>
  <div class="row">
    <label for="startMode">下一個</label>
    <div class="pair">
      <select id="startMode">
        <option value="auto">接續最大號</option>
        <option value="manual">指定</option>
      </select>
      <input type="number" id="startNumber" min="1" value="1">
    </div>
  </div>
  <label class="check"><input type="checkbox" id="sameNumber"> 轉換多條線時用同一個編號</label>

  <div class="tablebar">
    <span id="tableInfo">編號表</span>
    <button class="link" id="btnRefresh">重新整理</button>
  </div>
  <div class="numtable" id="numTable"><div class="empty">還沒有標註，按「新增標註」開始。</div></div>
  <p class="tip">點一列可選取並移到該標註。改數字後按 Enter；若號碼已存在，兩個號碼會互換。</p>

  <div class="row" style="margin-top:8px">
    <label for="sortMode">自動排序</label>
    <div class="pair">
      <select id="sortMode">
        <option value="clockwise">順時針</option>
        <option value="topdown">由上到下</option>
        <option value="leftright">由左到右</option>
        <option value="order">補齊空號</option>
      </select>
      <button class="btn" id="btnRenumber" style="flex:0 0 auto">重新編號</button>
    </div>
  </div>
</details>

<details open>
  <summary>樣式同步</summary>
  <button class="btn strong" id="btnSync" style="width:100%">同步全部標註的樣式</button>
  <label class="check"><input type="checkbox" id="autoSync"> 修改下方樣式時自動同步全部</label>
  <div class="grid2">
    <button class="btn" id="btnRestyle">套用到選取</button>
    <button class="btn" id="btnRelayout" title="用直接選取工具移動線條錨點後，讓編號重新對齊">重新排版選取</button>
  </div>
</details>

<details open>
  <summary>文字</summary>
  <div class="row">
    <label for="fontSize">字級 / 顏色</label>
    <div class="pair">
      <input type="number" id="fontSize" min="1" step="0.5" value="10">
      <input type="color" id="textColor" value="#000000">
    </div>
  </div>
  <div class="row">
    <label for="fontFamily">字體</label>
    <select id="fontFamily"><option value="">預設字體</option></select>
  </div>
  <div class="row">
    <label for="fontStyle">字重</label>
    <div class="pair">
      <select id="fontStyle" disabled></select>
      <button class="btn" id="btnFonts" style="flex:0 0 auto" title="安裝新字體後，重新讀取字體清單">重新讀取</button>
    </div>
  </div>
  <input type="hidden" id="fontName">
  <label class="check"><input type="checkbox" id="badge"> 數字加圓圈底</label>
  <div id="badgeRows">
    <div class="row">
      <label for="badgeColor">圓圈 / 數字</label>
      <div class="pair">
        <input type="color" id="badgeColor" value="#2b7bd6">
        <input type="color" id="badgeTextColor" value="#ffffff">
      </div>
    </div>
    <div class="row">
      <label for="badgePadding">內距 (pt)</label>
      <input type="number" id="badgePadding" min="0" step="0.5" value="2">
    </div>
    <div class="row">
      <label for="badgeStrokeWidth">邊框 / 顏色</label>
      <div class="pair">
        <input type="number" id="badgeStrokeWidth" min="0" step="0.25" value="0" title="邊框粗細 (pt)，0 = 無邊框">
        <input type="color" id="badgeStrokeColor" value="#000000">
      </div>
    </div>
  </div>
</details>

<details open>
  <summary>引線</summary>
  <div class="row">
    <label for="lineWidth">線寬 / 顏色</label>
    <div class="pair">
      <input type="number" id="lineWidth" min="0.1" step="0.25" value="0.75">
      <input type="color" id="lineColor" value="#2b7bd6">
    </div>
  </div>
  <div class="row">
    <label for="endStyle">端點</label>
    <div class="pair">
      <select id="endStyle">
        <option value="dot">圓點</option>
        <option value="arrow">箭頭</option>
        <option value="none">無</option>
        <option value="style">繪圖樣式</option>
      </select>
      <input type="number" id="endSize" min="0.5" step="0.5" value="2.5" title="端點大小 (pt)">
    </div>
  </div>
  <div class="row" id="styleRow">
    <label for="styleName">樣式名稱</label>
    <input type="text" id="styleName" value="CMF_Arrow" title="文件裡繪圖樣式的名稱，可在樣式中設定箭頭">
  </div>
  <div class="row">
    <label for="gap">文字間距</label>
    <input type="number" id="gap" min="0" step="0.5" value="2" title="編號與線頭的距離 (pt)">
  </div>
</details>

<details>
  <summary>其他</summary>
  <div class="setnum">
    <button class="btn" id="btnSetNumber">把選取的標註設為</button>
    <input type="number" id="setNumberValue" min="1" value="1" aria-label="編號">
  </div>
  <div class="grid2">
    <button class="btn" id="btnSelectAll">選取全部標註</button>
    <button class="btn" id="btnToggle">顯示 / 隱藏圖層</button>
  </div>
</details>

<div class="status" id="status">就緒</div>

<script>
(function () {
  var cep = window.__adobe_cep__;
  var KEY = "cmfCalloutSettings";
  var STYLE_FIELDS = ["fontSize", "textColor", "fontName", "badge", "badgeColor", "badgeTextColor", "badgePadding",
    "badgeStrokeWidth", "badgeStrokeColor", "lineWidth", "lineColor", "endStyle", "endSize", "styleName", "gap"];
  var FIELDS = ["lineMode", "continuous", "startMode", "startNumber", "sortMode", "sameNumber", "autoSync"].concat(STYLE_FIELDS);
  var MODE_TIPS = {
    straight: "點目標點 → 點編號位置",
    elbow: "點目標點 → 點轉折點 → 點編號位置",
    free: "左鍵持續加點，按「完成這條線」或快捷鍵完成"
  };
  var $ = function (id) { return document.getElementById(id); };

  // ---------- 主題：跟隨 Illustrator 介面亮度 ----------
  function applyTheme() {
    if (!cep) return;
    try {
      var env = JSON.parse(cep.getHostEnvironment());
      var c = env.appSkinInfo.panelBackgroundColor.color;
      var r = Math.round(c.red), g = Math.round(c.green), b = Math.round(c.blue);
      var root = document.documentElement;
      root.style.setProperty("--bg", "rgb(" + r + "," + g + "," + b + ")");
      var lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      root.classList.toggle("light", lum > 0.55);
      if (lum <= 0.55) {
        var f = function (v) { return Math.max(0, Math.round(v * 0.78)); };
        root.style.setProperty("--field", "rgb(" + f(r) + "," + f(g) + "," + f(b) + ")");
      } else {
        root.style.removeProperty("--field");
      }
    } catch (e) {}
  }

  // ---------- 與 ExtendScript 溝通 ----------
  function extensionPath() {
    if (!cep) return "";
    var p = decodeURI(cep.getSystemPath("extension"));
    return /^file:\/\/\/[A-Za-z]:/.test(p) ? p.replace("file:///", "") : p.replace("file://", "");
  }

  function q(obj) { return JSON.stringify(JSON.stringify(obj)); }

  function run(expr, cb, quiet) {
    if (!cep) { setStatus("請在 Illustrator 中開啟此面板", true); return; }
    cep.evalScript(expr, function (raw) {
      var r;
      try { r = JSON.parse(raw); } catch (e) { r = { ok: false, msg: "腳本錯誤：" + raw }; }
      if (!quiet && r.msg) setStatus(r.msg, !r.ok);
      if (cb) cb(r);
    });
  }

  function callHost(fn, obj, cb, quiet) {
    run("CMF." + fn + "(" + (obj ? q(obj) : "") + ")", cb, quiet);
  }

  function setStatus(msg, isError) {
    var s = $("status");
    s.textContent = msg;
    s.classList.toggle("error", !!isError);
  }

  // ---------- 設定 ----------
  function readSettings() {
    var o = {};
    FIELDS.forEach(function (k) {
      var el = $(k);
      if (el.type === "checkbox") o[k] = el.checked;
      else if (el.type === "number") o[k] = parseFloat(el.value) || 0;
      else o[k] = el.value;
    });
    o.hostPath = extensionPath() + "/jsx/host.jsx";
    return o;
  }

  function loadSettings() {
    try {
      var o = JSON.parse(localStorage.getItem(KEY) || "{}");
      FIELDS.forEach(function (k) {
        if (o[k] === undefined) return;
        var el = $(k);
        if (el.type === "checkbox") el.checked = !!o[k]; else el.value = o[k];
      });
    } catch (e) {}
  }

  var saveTimer = null;
  function saveSettings() {
    var o = readSettings();
    try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {}
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { if (cep) callHost("saveSettings", o, null, true); }, 400);
  }

  // ---------- 預覽 ----------
  function isDark(hex) {
    var h = hex.replace("#", "");
    var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) < 60;
  }

  function renderPreview() {
    var o = readSettings();
    $("badgeRows").classList.toggle("hidden", !o.badge);
    $("styleRow").classList.toggle("hidden", o.endStyle !== "style");
    $("startNumber").disabled = o.startMode === "auto";
    $("badgeStrokeColor").disabled = !(o.badgeStrokeWidth > 0);
    $("modeTip").textContent = MODE_TIPS[o.lineMode] || "";
    updateFinishButton();

    var scale = 1.6;
    // 編號端 → (轉折) → 目標點
    var pts = o.lineMode === "straight"
      ? [[70, 30], [196, 52]]
      : [[62, 24], [128, 24], [196, 52]];
    var S = pts[0], S1 = pts[1], E = pts[pts.length - 1], E1 = pts[pts.length - 2];
    var lw = Math.max(0.6, o.lineWidth * scale), es = o.endSize * scale;
    var parts = ['<path d="M178 84 C 186 50, 210 26, 260 20 L260 84 Z" fill="var(--product)"/>'];

    var ux = E[0] - E1[0], uy = E[1] - E1[1], L = Math.sqrt(ux * ux + uy * uy);
    ux /= L; uy /= L;
    var lineEnd = E;
    if (o.endStyle === "arrow") {
      var len = es * 1.6, hw = es * 0.5, bx = E[0] - ux * len, by = E[1] - uy * len;
      lineEnd = [bx, by];
      parts.push('<path d="M' + E[0] + ' ' + E[1] + ' L' + (bx - uy * hw) + ' ' + (by + ux * hw) +
        ' L' + (bx + uy * hw) + ' ' + (by - ux * hw) + 'Z" fill="' + o.lineColor + '"/>');
    }
    var poly = pts.slice(0, -1).concat([lineEnd]).map(function (p) { return p.join(","); }).join(" ");
    parts.push('<polyline points="' + poly + '" fill="none" stroke-linejoin="round" stroke="' + o.lineColor +
      '" stroke-width="' + lw + '"/>');
    if (o.endStyle === "dot") {
      parts.push('<circle cx="' + E[0] + '" cy="' + E[1] + '" r="' + es / 2 + '" fill="' + o.lineColor + '"/>');
    }

    // 編號沿第一段的反方向推出去
    var dx = S[0] - S1[0], dy = S[1] - S1[1], dl = Math.sqrt(dx * dx + dy * dy);
    dx /= dl; dy /= dl;
    var fs = Math.max(6, o.fontSize * scale), gap = o.gap * scale;
    var pf = previewFont(o);
    var font = pf.family + '" font-weight="' + pf.weight + '" font-style="' + (pf.italic ? "italic" : "normal");
    if (o.badge) {
      var R = fs * 0.42 + o.badgePadding * scale;
      var bsw = (o.badgeStrokeWidth || 0) * scale;
      var cx = S[0] + dx * (gap + R + bsw / 2), cy = S[1] + dy * (gap + R + bsw / 2);
      parts.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="' + o.badgeColor + '"' +
        (bsw > 0 ? ' stroke="' + o.badgeStrokeColor + '" stroke-width="' + bsw + '"' : '') + '/>');
      parts.push('<text x="' + cx + '" y="' + cy + '" fill="' + o.badgeTextColor + '" font-size="' + fs +
        '" font-family="' + font + '" text-anchor="middle" dominant-baseline="central">3</text>');
    } else {
      var w = fs * 0.3, h = fs * 0.36;
      var ext = Math.min(Math.abs(dx) > 0.001 ? w / Math.abs(dx) : 1e9, Math.abs(dy) > 0.001 ? h / Math.abs(dy) : 1e9);
      var tx = S[0] + dx * (gap + ext), ty = S[1] + dy * (gap + ext);
      var light = document.documentElement.classList.contains("light");
      var tc = light || !isDark(o.textColor) ? o.textColor : "#e6e6e6";
      parts.push('<text x="' + tx + '" y="' + ty + '" fill="' + tc + '" font-size="' + fs +
        '" font-family="' + font + '" text-anchor="middle" dominant-baseline="central">3</text>');
    }
    $("preview").innerHTML = parts.join("");
  }

  // ---------- 字體選單 ----------
  // fonts：{ 家族: [[字重, PostScript 名稱], ...] }，快取在 localStorage，避免每次開面板都掃描
  var FONT_KEY = "cmfCalloutFonts";
  var fonts = {}, fontIndex = {}; // fontIndex：PostScript 名稱 → [家族, 字重]

  function setFontData(list) {
    fonts = {}; fontIndex = {};
    list.forEach(function (f) {
      if (!fonts[f[0]]) fonts[f[0]] = [];
      fonts[f[0]].push([f[1], f[2]]);
      fontIndex[f[2]] = [f[0], f[1]];
    });
    var fam = $("fontFamily");
    var families = Object.keys(fonts).sort(function (a, b) { return a.localeCompare(b); });
    var html = '<option value="">預設字體</option>';
    families.forEach(function (name) {
      html += '<option value="' + name.replace(/"/g, "&quot;") + '">' + name.replace(/</g, "&lt;") + '</option>';
    });
    fam.innerHTML = html;
    syncFontSelects();
  }

  // 依目前的 PostScript 名稱，把兩個選單切到對應位置
  function syncFontSelects() {
    var hit = fontIndex[$("fontName").value];
    $("fontFamily").value = hit ? hit[0] : "";
    fillStyles(hit ? hit[1] : null);
  }

  function fillStyles(selected) {
    var fam = $("fontFamily").value, st = $("fontStyle");
    var styles = fonts[fam] || [];
    st.disabled = !styles.length;
    st.innerHTML = styles.map(function (s) {
      return '<option value="' + s[1].replace(/"/g, "&quot;") + '">' + s[0].replace(/</g, "&lt;") + '</option>';
    }).join("");
    if (!styles.length) return;
    var pick = null;
    styles.forEach(function (s) { if (s[0] === selected) pick = s[1]; });
    if (!pick) {
      // 換家族時，優先選一般字重
      styles.forEach(function (s) { if (!pick && /^(regular|roman|book|normal|w3|medium)$/i.test(s[0])) pick = s[1]; });
    }
    st.value = pick || styles[0][1];
  }

  function setFontName(name) {
    var el = $("fontName");
    if (el.value === name) return;
    el.value = name;
    el.dispatchEvent(new Event("change"));
  }

  function loadFonts(force) {
    if (!force) {
      try {
        var cached = JSON.parse(localStorage.getItem(FONT_KEY) || "null");
        if (cached && cached.length) { setFontData(cached); return; }
      } catch (e) {}
    }
    if (!cep) return;
    setStatus("讀取字體清單中…");
    run("CMF.listFonts()", function (r) {
      if (!r.ok || !r.fonts) return;
      try { localStorage.setItem(FONT_KEY, JSON.stringify(r.fonts)); } catch (e) {}
      setFontData(r.fonts);
    });
  }

  $("fontFamily").addEventListener("change", function () {
    fillStyles(null);
    setFontName($("fontFamily").value ? $("fontStyle").value : "");
  });
  $("fontStyle").addEventListener("change", function () { setFontName($("fontStyle").value); });
  $("btnFonts").addEventListener("click", function () { loadFonts(true); });

  // 預覽用：PostScript 名稱 → CSS 字體設定
  function previewFont(o) {
    var hit = fontIndex[o.fontName];
    if (!hit) return { family: "sans-serif", weight: 400, italic: false };
    var st = hit[1];
    var weight = /thin|hairline|w1/i.test(st) ? 200 : /extralight|ultralight|light|w2|w3/i.test(st) ? 300
      : /semibold|demibold|w6/i.test(st) ? 600 : /extrabold|ultrabold|heavy|black|w8|w9/i.test(st) ? 800
      : /bold|w7/i.test(st) ? 700 : /medium|w5/i.test(st) ? 500 : 400;
    return { family: "'" + hit[0].replace(/'/g, "") + "', sans-serif", weight: weight, italic: /italic|oblique/i.test(st) };
  }

  // ---------- 取色 ----------
  // 每個顏色欄位旁加一個滴管按鈕：按下後點畫布上的物件，取它的顏色
  var DROPPER = '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M13.7 2.3a2 2 0 0 0-2.8 0L9.2 4 8.5 3.3 7.1 4.7l.7.7-5.1 5.1-.5 2.4-.9.9 1.4 1.4.9-.9 2.4-.5 5.1-5.1.7.7 1.4-1.4-.7-.7 1.7-1.7a2 2 0 0 0 0-2.8zM5.1 12.3l-1.3.3.3-1.3 5.1-5.1 1 1z"/></svg>';
  var STROKE_FIRST = { lineColor: true, badgeStrokeColor: true };
  var picking = null, pickTimer = null, pickBusy = false, pickStart = 0;

  Array.prototype.forEach.call(document.querySelectorAll('input[type=color]'), function (input) {
    var box = document.createElement("span");
    box.className = "colorbox";
    input.parentNode.insertBefore(box, input);
    box.appendChild(input);
    var btn = document.createElement("button");
    btn.className = "pick";
    btn.type = "button";
    btn.title = "從畫布上的物件取色";
    btn.innerHTML = DROPPER;
    btn.addEventListener("click", function () {
      if (picking === input.id) { stopPick("已取消取色"); return; }
      startPick(input.id, btn);
    });
    box.appendChild(btn);
    // 顏色欄位停用時，滴管也停用
    new MutationObserver(function () { btn.disabled = input.disabled; })
      .observe(input, { attributes: true, attributeFilter: ["disabled"] });
  });

  function startPick(id, btn) {
    if (!cep) { setStatus("請在 Illustrator 中開啟此面板", true); return; }
    if (adding) stopAdd(true);
    if (picking) stopPick();
    callHost("beginPick", null, function (r) {
      if (!r.ok) return;
      picking = id;
      pickStart = Date.now();
      btn.classList.add("active");
      setStatus("點一下畫布上要取色的物件（再按一次滴管或 Esc 取消）");
      pickTimer = setInterval(pollPick, 150);
    });
  }

  function stopPick(msg, isError) {
    clearInterval(pickTimer);
    pickTimer = null;
    picking = null;
    Array.prototype.forEach.call(document.querySelectorAll(".pick.active"), function (b) { b.classList.remove("active"); });
    if (cep) cep.evalScript("CMF.endPick()", function () {});
    if (msg) setStatus(msg, isError);
  }

  function pollPick() {
    if (!picking || pickBusy) return;
    if (Date.now() - pickStart > 20000) { stopPick("取色逾時，已取消"); return; }
    pickBusy = true;
    var id = picking;
    run("CMF.pollPick(" + q({ prefer: STROKE_FIRST[id] ? "stroke" : "fill" }) + ")", function (r) {
      pickBusy = false;
      if (picking !== id || !r || r.state !== "done") return;
      if (r.ok && r.hex) {
        var input = $(id);
        input.value = r.hex;
        input.dispatchEvent(new Event("input"));
        input.dispatchEvent(new Event("change"));
      }
      stopPick(r.msg, !r.ok);
    }, true);
  }

  // ---------- 編號表 ----------
  var refreshing = false;
  function refreshTable() {
    if (!cep || refreshing) return;
    refreshing = true;
    run("CMF.listNumbers()", function (r) {
      refreshing = false;
      var box = $("numTable");
      var items = (r && r.items) || [];
      var total = items.reduce(function (s, it) { return s + it.count; }, 0);
      $("tableInfo").textContent = items.length ? "編號表：" + items.length + " 個編號，" + total + " 個標註" : "編號表";
      if (!items.length) {
        box.innerHTML = '<div class="empty">還沒有標註，按「新增標註」開始。</div>';
        return;
      }
      // 正在編輯某一格時不重畫，避免打字被打斷
      if (box.contains(document.activeElement) && document.activeElement.tagName === "INPUT") return;
      box.innerHTML = "";
      items.forEach(function (it) {
        var row = document.createElement("div");
        row.className = "numrow";
        row.innerHTML = '<input type="number" min="1" value="' + it.num + '" aria-label="編號 ' + it.num + '">' +
          '<span class="count">' + (it.count > 1 ? it.count + " 處" : "1 處") + '</span>' +
          '<span class="go">選取</span>';
        var input = row.querySelector("input");
        input.addEventListener("click", function (e) { e.stopPropagation(); });
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") input.blur();
          if (e.key === "Escape") { input.value = it.num; input.blur(); }
        });
        input.addEventListener("change", function () {
          var to = parseInt(input.value, 10);
          if (!(to > 0) || to === it.num) { input.value = it.num; return; }
          callHost("changeNumber", { from: it.num, to: to }, function () { setTimeout(refreshTable, 0); });
        });
        row.addEventListener("click", function () { callHost("selectNumber", { num: it.num, center: true }); });
        box.appendChild(row);
      });
    }, true);
  }

  // ---------- 互動新增 ----------
  function updateFinishButton() {
    $("btnFinish").classList.toggle("hidden", !(adding && $("lineMode").value === "free"));
  }

  function finishFree() {
    if (!adding) return;
    run("CMF.finishFree(" + q(readSettings()) + ")", function (r) {
      if (!r.ok) return;
      afterAdded(r);
      if ($("continuous").checked) setStatus(r.msg + "，繼續點下一個目標點");
      else stopAdd(false);
    });
  }

  var adding = false, pollTimer = null, polling = false, idleSince = 0;
  var IDLE_LIMIT = 45000; // 連續模式閒置太久自動結束，避免誤轉換其他線段

  function startAdd() {
    if (!cep) { setStatus("請在 Illustrator 中開啟此面板", true); return; }
    if (picking) stopPick();
    callHost("beginAdd", null, function (r) {
      if (!r.ok) return;
      adding = true;
      idleSince = Date.now();
      $("btnAdd").textContent = "結束新增";
      $("btnAdd").classList.add("active");
      updateFinishButton();
      if (!r.msg) setStatus(MODE_TIPS[$("lineMode").value]);
      pollTimer = setInterval(poll, 200);
    });
  }

  function stopAdd(keepTool) {
    clearInterval(pollTimer);
    pollTimer = null;
    adding = false;
    $("btnAdd").textContent = "新增標註";
    $("btnAdd").classList.remove("active");
    updateFinishButton();
    run("CMF.endAdd(" + (keepTool ? "true" : "false") + "," + q(readSettings()) + ")", afterAdded);
  }

  function afterAdded(r) {
    if (r && r.ok && r.next && $("startMode").value === "manual") {
      $("startNumber").value = r.next;
      saveSettings();
    }
    refreshTable();
  }

  function poll() {
    if (polling || !adding) return;
    polling = true;
    run("CMF.pollAdd(" + q(readSettings()) + ")", function (r) {
      polling = false;
      if (!adding || !r) return;
      if (r.state === "drawing") { idleSince = Date.now(); return; }
      if (r.state === "error") { setStatus(r.msg, true); stopAdd(true); return; }
      if (r.state === "done") {
        idleSince = Date.now();
        afterAdded(r);
        if ($("continuous").checked) {
          setStatus(r.msg + "，繼續點下一個目標點");
        } else {
          setStatus(r.msg);
          stopAdd(false);
        }
        return;
      }
      if ($("continuous").checked && Date.now() - idleSince > IDLE_LIMIT) {
        setStatus("閒置過久，已結束新增");
        stopAdd(true);
      }
    }, true);
  }

  // ---------- 樣式自動同步 ----------
  var syncTimer = null;
  function scheduleSync() {
    if (!$("autoSync").checked || !cep) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function () { callHost("syncAll", readSettings()); }, 700);
  }

  // ---------- 事件 ----------
  FIELDS.forEach(function (k) {
    var isStyle = STYLE_FIELDS.indexOf(k) >= 0;
    var handler = function () {
      renderPreview();
      saveSettings();
      if (isStyle) scheduleSync();
    };
    $(k).addEventListener("input", handler);
    $(k).addEventListener("change", handler);
  });

  $("btnAdd").addEventListener("click", function () { if (adding) stopAdd(false); else startAdd(); });
  $("btnFinish").addEventListener("click", finishFree);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && picking) { stopPick("已取消取色"); return; }
    if (e.key === "Escape" && adding && document.activeElement.tagName !== "INPUT") stopAdd(false);
  });

  $("btnConvert").addEventListener("click", function () { callHost("convert", readSettings(), afterAdded); });
  $("btnRenumber").addEventListener("click", function () { callHost("renumber", readSettings(), refreshTable); });
  $("btnRefresh").addEventListener("click", refreshTable);
  $("btnSync").addEventListener("click", function () { callHost("syncAll", readSettings()); });
  $("btnRestyle").addEventListener("click", function () { callHost("restyle", readSettings()); });
  $("btnRelayout").addEventListener("click", function () { callHost("relayout"); });
  $("btnSelectAll").addEventListener("click", function () { callHost("selectAll"); });
  $("btnToggle").addEventListener("click", function () { callHost("toggleLayer"); });
  $("btnSetNumber").addEventListener("click", function () {
    callHost("setNumber", { num: parseInt($("setNumberValue").value, 10) }, refreshTable);
  });

  // 滑鼠移回面板或切換文件時，更新編號表（使用者可能在畫布上刪除或複製了標註）
  var lastEnter = 0;
  document.body.addEventListener("mouseenter", function () {
    if (adding || Date.now() - lastEnter < 800) return;
    lastEnter = Date.now();
    refreshTable();
  });

  if (cep) {
    try { cep.addEventListener("com.cmf.callout.add", function () { if (adding) stopAdd(false); else startAdd(); }); } catch (e) {}
    try { cep.addEventListener("com.cmf.callout.finish", finishFree); } catch (e) {}
    try { cep.addEventListener("documentAfterActivate", refreshTable); } catch (e) {}
    try { cep.addEventListener("com.adobe.csxs.events.ThemeColorChanged", function () { applyTheme(); renderPreview(); }); } catch (e) {}
  }

  applyTheme();
  loadSettings();
  loadFonts(false);
  renderPreview();
  saveSettings();
  refreshTable();
  if (!cep) setStatus("預覽模式：請在 Illustrator 中使用", true);
})();
</script>
</body>
</html>
